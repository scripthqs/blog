<!doctype html>
<html>
  <head>
    <title>我的第一个 AI 助手</title>
    <meta charset="utf-8" />
  </head>
  <body>
    <h2>对话 DeepSeek</h2>
    <!-- 1. 简单的界面 -->
    <textarea id="userInput" placeholder="输入你想问的话..." rows="3" style="width: 300px"></textarea>
    <button onclick="askAI()">发送</button>

    <div id="response" style="margin-top: 20px; border: 1px solid #ccc; padding: 10px; white-space: pre-wrap">AI 的回复会显示在这里...</div>

    <script>
      // 1. 定义一个全局数组，用来存所有的对话
      let chatHistory = [{ role: "system", content: "你是一个乐于助人的前端助手。" }];

      async function askAI() {
        const input = document.getElementById("userInput").value;
        const resDiv = document.getElementById("response");

        // 2. 把用户说的话，先塞进记忆里
        chatHistory.push({ role: "user", content: input });

        const response = await fetch("https://api.deepseek.com", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer YOUR_DEEPSEEK_API_KEY",
          },
          body: JSON.stringify({
            model: "deepseek-chat",
            // 3. 关键点：把整个对话历史发过去，而不仅仅是当前这一句
            messages: chatHistory,
            stream: true,
          }),
        });

        let fullReply = ""; // 用来记录 AI 本次完整回的话

        // ...省略中间处理流的代码（参考上一条回复）...
        // 假设最后得到的完整回复存到了 fullReply 变量里

        // 4. AI 说完后，把 AI 的话也塞进记忆里，下次发请求时一起带上
        chatHistory.push({ role: "assistant", content: fullReply });
      }
      async function askAI() {
        const input = document.getElementById("userInput").value;
        const resDiv = document.getElementById("response");
        resDiv.innerText = "思考中...";

        // 2. 这里就是调 AI 接口的地方
        const response = await fetch("https://api.deepseek.com/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            // 把下面这行换成你自己的 API Key
            Authorization: "Bearer sk-faa6c7c682c642bd8684ecdb67faff3d",
          },
          body: JSON.stringify({
            model: "deepseek-chat",
            messages: [{ role: "user", content: input }],
            // 开启流式传输，实现打字机效果
            stream: true,
          }),
        });

        // 3. 处理流式数据（前端核心功力）
        resDiv.innerText = ""; // 清空提示
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          // 这里是一段比较绕的逻辑：处理 AI 返回的数据碎片
          const lines = chunk.split("\n");
          for (const line of lines) {
            if (line.startsWith("data: ") && line !== "data: [DONE]") {
              const data = JSON.parse(line.substring(6));
              const content = data.choices[0].delta.content || "";
              resDiv.innerText += content; // 一个字一个字往里加
            }
          }
        }
      }
    </script>
  </body>
</html>
